name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  unit:
    # Service-backed tests skip here. A green run is NOT proof of PostgreSQL,
    # RabbitMQ or Valkey behaviour: see the integration job for that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q -rs
      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit==2.10.1 -r requirements-audit.txt --no-deps --disable-pip

  integration:
    # Runs the same suite against real services so the LAB_TEST_* tests execute.
    # Not covered: DynamoDB Local, Loki and the live demo/drills (LAB_TEST_DYNAMODB_URL,
    # LAB_TEST_LOKI_URL, LAB_TEST_VALKEY_DOWN_URL, LAB_TEST_DEMO, LAB_TEST_DRILLS stay
    # unset), so those tests still skip; -rs lists every skip in the log.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: warehouse_lab
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U lab -d warehouse_lab"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: lab
          RABBITMQ_DEFAULT_PASS: lab
        ports:
          - 55672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 10
      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LAB_TEST_DATABASE_URL: postgresql+psycopg://lab:lab@127.0.0.1:55432/warehouse_lab
      LAB_TEST_AMQP_URL: amqp://lab:lab@127.0.0.1:55672/
      LAB_TEST_VALKEY_URL: valkey://127.0.0.1:56379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q -rs
